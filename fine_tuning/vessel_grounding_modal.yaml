project_name: "coda-dvd-vessel-grounding"
model_name: "lfm2.5-VL-450M"
training_type: "vlm_sft"

dataset:
  path: "/satellite-vlm/data/vrsbench/vrsbench_grounding_train.jsonl"
  type: "vlm_sft"
  test_size: 0.05
  image_root: "/satellite-vlm/data/vrsbench/images"
  # limit: 1000  # uncomment for quick testing

training_config:
  extends: "DEFAULT_VLM_SFT"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 3e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  eval_on_start: true
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  logging_steps: 10
  # tracker: "wandb"

peft_config:
  extends: "DEFAULT_VLM_LORA"
  use_peft: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

benchmarks:
  max_new_tokens: 256
  image_root: "/satellite-vlm/data/vrsbench/images"
  benchmarks:
    - name: "vessel_grounding_iou50"
      path: "/satellite-vlm/data/vrsbench/vrsbench_grounding_eval.jsonl"
      metric: "grounding_iou"
      iou_threshold: 0.5
      max_new_tokens: 256
      limit: 200

    - name: "vessel_grounding_iou25"
      path: "/satellite-vlm/data/vrsbench/vrsbench_grounding_eval.jsonl"
      metric: "grounding_iou"
      iou_threshold: 0.25
      max_new_tokens: 256
      limit: 200

modal:
  app_name: "coda-dvd-finetune"
  gpu: "H100"
  timeout: 86400
  output_volume: "satellite-vlm"
  output_dir: "/satellite-vlm"
  detach: false
